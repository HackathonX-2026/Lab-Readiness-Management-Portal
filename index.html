<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236256ce'%3E%3Cpath d='M6 2h12v4l-4 6 4 6v4H6v-4l4-6-4-6V2z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Lab Readiness Management Portal</title>
    <script>
      // Apply the saved preference before first paint; new sessions use the reference dark theme.
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('lab-readiness:theme') !== 'light');
      } catch { /* The default dark theme also works without browser storage. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
